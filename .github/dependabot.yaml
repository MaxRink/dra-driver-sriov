version: 2
updates:
# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  commit-message:
    prefix: "chore:"
  labels:
    - "dependencies"
    - "github-actions"

# Go modules
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  commit-message:
    prefix: "chore:"
  labels:
    - "dependencies"
    - "go"
  groups:
    kubernetes-dependencies:
      patterns:
        - "k8s.io/*"
    gomod-dependencies:
      patterns:
        - "*"
      exclude-patterns:
        - "k8s.io/*"
- package-ecosystem: docker
  directories:
  - /deployments/container
  - /docker
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directories:
  - /.github/actions/collect-virtual-e2e-logs
  - /.github/actions/deploy-virtual-cluster
  - /.github/actions/run-e2e-workloads
  - /.github/actions/setup-virtual-e2e-host
  - /.github/actions/upload-e2e-reports
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: helm
  directory: /deployments/helm/dra-driver-sriov
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
